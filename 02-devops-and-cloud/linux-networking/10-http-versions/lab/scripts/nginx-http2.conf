# Cấu hình tham khảo Nginx >= 1.25 làm Edge HTTP/2 (+ HTTP/3) trước JBoss AS 7.1.1 (HTTP/1.1 Keep-Alive)
upstream jboss_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 8443 ssl;
    listen 8443 quic reuseport;   # Bật HTTP/3 QUIC trên UDP 8443 (Nginx >= 1.25)
    http2 on;
    http3 on;

    server_name localhost;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Quảng bá HTTP/3 cho client tự nâng cấp ở các request sau
    add_header Alt-Svc 'h3=":8443"; ma=86400';

    location / {
        proxy_pass http://jboss_backend;
        # Bắt buộc đặt 1.1 và xóa Connection để upstream keepalive 64 hoạt động
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
