# Nginx config mẫu bật TLS 1.3 + fullchain + mTLS (xác thực client cert)
server {
    listen 8443 ssl;
    http2 on;
    server_name api.lab.local;

    # Server KeyStore: phải ghép Leaf + Intermediate (server-fullchain.pem)
    ssl_certificate     /etc/nginx/certs/server-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # mTLS: xác minh Client Certificate bằng chuỗi CA tin cậy
    ssl_client_certificate /etc/nginx/certs/ca-chain.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    location / {
        return 200 "mTLS OK for client: $ssl_client_s_dn\n";
    }
}
