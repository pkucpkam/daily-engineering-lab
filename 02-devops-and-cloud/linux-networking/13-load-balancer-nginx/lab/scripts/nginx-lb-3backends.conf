# Cấu hình Nginx cân tải 3 backend (JBoss/App) chuẩn LNX-13
upstream app_cluster {
    least_conn;
    server 127.0.0.1:8081 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8082 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:8083 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 8080;
    server_name localhost;

    location /api/ {
        proxy_pass http://app_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_send_timeout    10s;
        proxy_read_timeout    30s;
        proxy_buffering       on;

        # Chỉ retry với GET/HEAD idempotent (KHÔNG gắn non_idempotent!)
        proxy_next_upstream error timeout http_502 http_503;
    }
}
